name: Actualizar datos

on:
  schedule:
    - cron: '0 5 * * 1' # lunes, 05:00 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  actualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/actualizar.mjs
      - name: Commit si hay cambios
        run: |
          if git diff --quiet; then
            echo "Sin cambios."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add normativas.json normativas.csv README.md
          git commit -m "data: actualizar desde FincasAlDía ($(date -u +%F))"
          git push
